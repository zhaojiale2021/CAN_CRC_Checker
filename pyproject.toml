[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crc-checker"
dynamic = ["version"]
description = "CAN bus CRC / rolling-counter verification from DBC files and trace logs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "python-can>=4.5",
    "canmatrix>=1.1",
    "click>=8.1",
    "openpyxl>=3.0",
    "xlrd>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
mf4 = ["python-can[mf4]>=4.5"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pylint==3.3.9",
]

[project.scripts]
crc-check = "cli.main:cli"

[tool.setuptools.dynamic]
version = { attr = "crc_checker.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["crc_checker*", "cli*", "webapp*"]

[tool.setuptools.package-data]
crc_checker = ["data/*.yaml"]
webapp = [
    "static/dist/index.html",
    "static/dist/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
