[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canvouch"
dynamic = ["version"]
description = "DBC-aware CRC, rolling-counter and E2E protection verification for CAN traces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "CanVouch contributors" }]
keywords = ["can", "can-bus", "dbc", "crc", "e2e", "automotive", "trace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "python-can>=4.5",
    "canmatrix>=1.1",
    "click>=8.1",
    "openpyxl>=3.0",
    "xlrd>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
mf4 = ["python-can[mf4]>=4.5"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "httpx>=0.27",
    "jsonschema>=4",
    "pylint==3.3.9",
]

[project.scripts]
canvouch = "cli.main:cli"
crc-check = "cli.main:cli"   # compatibility alias for the pre-rename command

[project.urls]
Homepage = "https://github.com/zhaojiale2021/canvouch"
Repository = "https://github.com/zhaojiale2021/canvouch"
Issues = "https://github.com/zhaojiale2021/canvouch/issues"
Changelog = "https://github.com/zhaojiale2021/canvouch/releases"

[tool.setuptools.dynamic]
version = { attr = "crc_checker.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["crc_checker*", "cli*", "webapp*"]

[tool.setuptools.package-data]
crc_checker = ["data/*.yaml"]
webapp = [
    "static/dist/index.html",
    "static/dist/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
