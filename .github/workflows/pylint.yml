name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    # Pin the runner: ubuntu-latest moved to Ubuntu 26.04, which no longer
    # ships a Python 3.9 build, so setup-python failed before any step ran.
    # 24.04 still provides 3.9 (the project's floor: requires-python >= 3.9).
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    - name: Lint with pylint
      run: |
        # pylint 版本固定在 requirements.txt(CI py3.9 只能装 3.3.9,
        # 参数上限比 4.x 严;本地钩子用同一版本才能拦同样的东西)
        pylint $(git ls-files '*.py')
    - name: Test with pytest
      run: |
        pytest --tb=short

  # 汇总门禁:分支 ruleset 只要求 "CI required" 这一个稳定的检查名,
  # 以后增删矩阵维度或给作业改名,都不用回头改 ruleset。
  gate:
    name: CI required
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: 所有上游作业都成功才算通过
        run: |
          echo "build=${{ needs.build.result }}"
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::上游作业失败或被取消,门禁不通过"
            exit 1
          fi
